[project]
name = "sparkscope"
version = "0.2.0"
description = "Open-source PySpark performance analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Vincent Kanka" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.2.0",
    "twine>=5.0.0"
]

spark = [
    "pyspark>=3.5,<5"
]

[project.scripts]
sparkscope = "sparkscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/vincentkanka/sparkscope"
Repository = "https://github.com/vincentkanka/sparkscope"
Issues = "https://github.com/vincentkanka/sparkscope/issues"